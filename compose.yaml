services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: perdiu
      POSTGRES_DB: perdiu_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perdiu -d perdiu_dev']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
