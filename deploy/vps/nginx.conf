worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # Omit query strings from access logs: Auth confirmation URLs contain credentials.
    log_format safe '$remote_addr "$request_method $uri $server_protocol" $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 1m;
        set $api perdi-u-api:3000;
        set $auth perdi-u-auth:9999;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api;
        }

        location /auth/ {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://$auth;
        }

        location / {
            return 404;
        }
    }
}
